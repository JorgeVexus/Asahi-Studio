<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Clientes | Asahi Studio</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #0a0a0a;
            --bg-secondary: #111;
            --text: #f5f5f5;
            --text-secondary: #b0b0b0;
            --accent: #ff6b4a;
            --border: #222;
            --radius: 12px;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Access View */
        #accessView {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .access-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .access-card h1 {
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .access-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* Portal Layout */
        #portalDashboard {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
        }

        .logo-mark {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--bg);
        }

        main {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .view-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
        }

        /* Ticket List */
        .ticket-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .ticket-item:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .ticket-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .ticket-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            gap: 1rem;
        }

        .status-nuevo { background: rgba(255,107,74,0.1); color: var(--accent); }
        .status-en_proceso { background: rgba(245,158,11,0.1); color: var(--warning); }
        .status-revision { background: rgba(16,185,129,0.1); color: var(--success); }
        .status-completado { background: #222; color: var(--text-secondary); }

        .unread-badge {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent);
        }

        /* Attachments Grid */
        .attachments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .attachment-item {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            background: var(--bg);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .attachment-item:hover {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        .attachment-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .attachment-item .item-actions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .attachment-item:hover .item-actions {
            opacity: 1;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        /* Lightbox modal */
        #lightboxModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            padding: 2rem;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #lightboxModal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-lightbox {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-lightbox:hover {
            background: var(--accent);
            color: var(--bg);
            transform: rotate(90deg);
        }

        .category-tag {
            font-size: 0.65rem;
            padding: 2px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Generic UI */
        .form-group { margin-bottom: 1.25rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); }
        input, textarea, select { 
            width: 100%; padding: 0.75rem 1rem; background: var(--bg); 
            border: 1px solid var(--border); border-radius: 8px; color: var(--text);
            font-family: inherit;
        }
        textarea { min-height: 120px; resize: vertical; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }

        .btn-primary { background: var(--accent); color: var(--bg); }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }

        .btn-outline { 
            background: transparent; 
            border: 1px solid var(--border); 
            color: var(--text); 
        }
        .btn-outline:hover { background: var(--border); }

        /* Modal / New Ticket */
        #newTicketModal, #chatModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            max-width: 600px;
            margin: 0 auto;
            border-radius: var(--radius);
            padding: 2rem;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* Chat UI */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
            padding-right: 0.5rem;
        }

        .message {
            max-width: 85%;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .msg-client {
            align-self: flex-end;
            background: var(--accent);
            color: var(--bg);
            border-bottom-right-radius: 2px;
        }

        .msg-admin {
            align-self: flex-start;
            background: var(--border);
            color: var(--text);
            border-bottom-left-radius: 2px;
        }

        .msg-meta {
            font-size: 0.7rem;
            margin-top: 0.4rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            main { padding: 1rem; }
            .modal-content { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Access View -->
    <div id="accessView">
        <div class="access-card">
            <div class="logo" style="justify-content: center; margin-bottom: 2rem;">
                <div class="logo-mark" style="width: 40px; height: 40px; font-size: 1.5rem;">A</div>
                <span style="font-size: 1.75rem;">Asahi Portal</span>
            </div>
            <h1>Bienvenido</h1>
            <p>Ingresa el correo que registraste en tu onboarding para gestionar tus ajustes y cambios.</p>
            <form id="accessForm">
                <div class="form-group">
                    <input type="email" id="clientEmail" required placeholder="tu@correo.com">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Ingresar al Portal</button>
            </form>
        </div>
    </div>

    <!-- Portal Dashboard -->
    <div id="portalDashboard">
        <header>
            <div class="logo">
                <div class="logo-mark">A</div>
                <span>Portal Asahi</span>
            </div>
            <div id="activeEmail" style="color: var(--text-secondary); font-size: 0.85rem;"></div>
            <button class="btn-outline btn" id="exitBtn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Salir</button>
        </header>

        <main>
            <div class="view-header">
                <h2>Mis Ajustes y Cambios</h2>
                <button class="btn btn-primary" id="openNewTicketBtn">
                    <i data-lucide="plus"></i> Nuevo Ajuste
                </button>
            </div>

            <div id="ticketsList">
                <!-- Loaded by JS -->
                <div style="text-align: center; color: var(--text-secondary); padding: 4rem;">
                    Buscando tus tickets...
                </div>
            </div>
        </main>
    </div>

    <!-- New Ticket Modal -->
    <div id="newTicketModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('newTicketModal')"><i data-lucide="x"></i></button>
            <h2 style="margin-bottom: 1.5rem; font-family: 'Space Grotesk';">Solicitar Ajuste o Cambio</h2>
            <form id="newTicketForm">
                <div class="form-group">
                    <label>Asunto / Título breve</label>
                    <input type="text" id="ticketSubject" placeholder="Ej: Ajuste de logo en móvil" required>
                </div>
                <div class="form-group">
                    <label>Descripción detallada</label>
                    <textarea id="ticketContent" placeholder="Describe el cambio o ajuste necesario..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Urgencia</label>
                    <select id="ticketPriority">
                        <option value="baja">Baja - Estético / Menor</option>
                        <option value="media" selected>Media - Importante</option>
                        <option value="alta">Alta - Urgente / Crítico</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="ticketCategory">
                        <option value="Ajustes" selected>Ajustes Generales</option>
                        <option value="Diseño">Diseño / UI</option>
                        <option value="Desarrollo">Desarrollo / Funcionalidad</option>
                        <option value="Contenido">Contenido / Textos</option>
                        <option value="Soporte">Soporte Técnico</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Adjuntar Capturas o Documentos</label>
                    <input type="file" id="ticketFile" multiple style="padding: 0.5rem; border: dashed 1px var(--border);">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Enviar Solicitud</button>
            </form>
        </div>
    </div>

    <!-- Chat/Detail Modal -->
    <div id="chatModal">
        <div class="modal-content" style="max-width: 800px;">
            <button class="close-modal" onclick="closeModal('chatModal')"><i data-lucide="x"></i></button>
            <h2 id="chatTitle" style="margin-bottom: 0.5rem; font-family: 'Space Grotesk';">Detalle del Ajuste</h2>
            <div id="chatStatus" style="margin-bottom: 2rem;"></div>
            
            <div class="chat-container" id="chatMessages">
                <!-- Messages populate here -->
            </div>

            <form id="chatForm" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="chatInput" placeholder="Escribe un mensaje..." required style="flex: 1;">
                    <label for="chatFile" class="btn btn-outline" style="padding: 0.75rem; cursor: pointer; margin-bottom: 0;">
                        <i data-lucide="paperclip"></i>
                        <input type="file" id="chatFile" multiple style="display: none;">
                    </label>
                    <button type="submit" class="btn btn-primary"><i data-lucide="send"></i></button>
                </div>
                <div id="filePreview" style="font-size: 0.8rem; color: var(--accent); display: none;"></div>
            </form>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" onclick="this.style.display='none'">
        <button class="close-lightbox"><i data-lucide="x"></i></button>
        <img id="lightboxImg" src="" alt="Vista previa" onclick="event.stopPropagation()">
    </div>

    <script type="module" src="/js/portal.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
