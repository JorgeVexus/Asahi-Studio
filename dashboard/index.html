<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Asahi Studio</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #0a0a0a;
            --bg-secondary: #111;
            --text: #f5f5f5;
            --text-secondary: #b0b0b0;
            --accent: #ff6b4a;
            --border: #222;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Login Layout */
        #loginView {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .login-card h1 {
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Dashboard Layout */
        #mainDashboard {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
        }

        .logo-mark {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--bg);
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-logout {
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout:hover { color: var(--accent); }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: var(--radius);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Table Styles */
        .table-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #1a1a1a;
            padding: 1rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tr:hover {
            background: rgba(255,107,74,0.02);
        }

        .btn-view {
            color: var(--accent);
            background: none;
            border: 1px solid rgba(255,107,74,0.3);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-view:hover {
            background: var(--accent);
            color: var(--bg);
        }

        /* Modal Details */
        #detailModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            max-width: 800px;
            margin: 0 auto;
            border-radius: var(--radius);
            padding: 2.5rem;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .detail-item {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .detail-item:last-child { border: none; }

        .detail-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-value {
            color: var(--text);
            font-size: 1rem;
            white-space: pre-wrap;
        }

        .detail-value a {
            color: var(--accent);
            word-break: break-all;
        }

        /* Generic UI */
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); }
        input { 
            width: 100%; padding: 0.75rem 1rem; background: var(--bg); 
            border: 1px solid var(--border); border-radius: 8px; color: var(--text);
        }
        .btn-submit {
            width: 100%; padding: 0.8rem; background: var(--accent); 
            color: var(--bg); border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
        }

        @media (max-width: 768px) {
            .hide-mobile { display: none; }
            main { padding: 1rem; }
            .modal-content { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Login View -->
    <div id="loginView">
        <div class="login-card">
            <h1>Admin Panel</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="admin@asahi.studio">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard View -->
    <div id="mainDashboard">
        <header>
            <div class="logo">
                <div class="logo-mark">A</div>
                <span>Dashboard Asahi</span>
            </div>
            <div class="user-nav">
                <a href="/dashboard/tickets.html" style="color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;">
                    <i data-lucide="ticket" size="18"></i> Tickets
                </a>
                <span id="userEmail" class="hide-mobile"></span>
                <button class="btn-logout" id="logoutBtn">
                    <i data-lucide="log-out" size="18"></i> Salir
                </button>
            </div>
        </header>

        <main>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Onboardings</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Ajustes Pendientes</div>
                    <div class="stat-value" id="pendingTicketsCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Nuevos (Hoy)</div>
                    <div class="stat-value" id="todayCount">0</div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th class="hide-mobile">Empresa</th>
                            <th class="hide-mobile">Email</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="responsesTable">
                        <!-- Content here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal"><i data-lucide="x"></i></button>
            <h2 id="modalTitle" style="margin-bottom: 2rem; font-family: 'Space Grotesk';">Detalle del Cliente</h2>
            <div id="modalBody">
                <!-- Detailed content populated by JS -->
            </div>
        </div>
    </div>

    <script type="module" src="/js/dashboard.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
