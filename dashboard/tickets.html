<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tickets | Asahi Studio</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #0a0a0a;
            --bg-secondary: #111;
            --text: #f5f5f5;
            --text-secondary: #b0b0b0;
            --accent: #ff6b4a;
            --border: #222;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            padding: 1rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-mark {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--bg);
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .view-header h1 {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Layout Grid */
        .tickets-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            height: calc(100vh - 180px);
        }

        /* Ticket List */
        .ticket-sidebar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-y: auto;
        }

        .sidebar-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .sidebar-item:hover { background: #1a1a1a; }
        .sidebar-item.active { background: #1a1a1a; border-left: 3px solid var(--accent); }

        .sidebar-item h3 { font-size: 0.95rem; margin-bottom: 0.2rem; }
        .sidebar-item .client { font-size: 0.75rem; color: var(--text-secondary); }

        /* Chat View */
        .chat-view {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: none; /* Shown when ticket selected */
            flex-direction: column;
        }

        .chat-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 70%;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .msg-admin { align-self: flex-end; background: var(--accent); color: var(--bg); }
        .msg-client { align-self: flex-start; background: var(--border); color: var(--text); }

        .chat-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border);
        }

        .status-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-nuevo { background: rgba(255,107,74,0.1); color: var(--accent); }
        .status-en_proceso { background: rgba(245,158,11,0.1); color: #f59e0b; }
        .status-revision { background: rgba(16,185,129,0.1); color: #10b981; }
        .status-completado { background: #222; color: var(--text-secondary); }

        .unread-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--accent);
        }

        .category-tag {
            font-size: 0.6rem;
            padding: 2px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-top: 4px;
            display: inline-block;
        }

        /* Attachments Grid */
        .attachments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .attachment-item {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            background: var(--bg);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .attachment-item:hover {
            transform: scale(1.05);
            border-color: var(--accent);
        }

        .attachment-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .attachment-item .item-actions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .attachment-item:hover .item-actions {
            opacity: 1;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        /* Lightbox modal */
        #lightboxModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            padding: 2rem;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #lightboxModal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-lightbox {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-lightbox:hover {
            background: var(--accent);
            color: var(--bg);
            transform: rotate(90deg);
        }

        .form-group { display: flex; gap: 0.5rem; }
        input { 
            flex: 1; padding: 0.75rem 1rem; background: var(--bg); 
            border: 1px solid var(--border); border-radius: 8px; color: var(--text);
        }
        
        select {
            padding: 0.5rem; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); border-radius: 6px; font-size: 0.8rem;
        }

        .btn-send {
            background: var(--accent); color: var(--bg); border: none;
            padding: 0 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer;
        }

        @media (max-width: 900px) {
            .tickets-layout { grid-template-columns: 1fr; }
            .ticket-sidebar.hidden { display: none; }
            .chat-view.visible { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 1000; border-radius: 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-mark">A</div>
            <span>Admin Tickets</span>
        </div>
        <a href="/dashboard" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;">← Volver al Dashboard</a>
    </header>

    <main>
        <div class="view-header">
            <h1>Inbox de Ajustes</h1>
            <div style="display: flex; gap: 1rem;">
                <select id="filterStatus">
                    <option value="all">Todos los estados</option>
                    <option value="nuevo">Nuevos</option>
                    <option value="en_proceso">En Proceso</option>
                    <option value="completado">Completados</option>
                </select>
            </div>
        </div>

        <div class="tickets-layout">
            <div class="ticket-sidebar" id="ticketSidebar">
                <!-- Loaded by JS -->
            </div>

            <div class="chat-view" id="chatView">
                <div class="chat-header">
                    <div>
                        <h2 id="chatSubject" style="font-size: 1.1rem; font-family: 'Space Grotesk';">Asunto del Ticket</h2>
                        <div id="chatClient" style="font-size: 0.8rem; color: var(--text-secondary);">cliente@mail.com</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <select id="updateStatus">
                            <option value="nuevo">Nuevo</option>
                            <option value="en_proceso">En Proceso</option>
                            <option value="revision">En Revisión</option>
                            <option value="completado">Completado</option>
                        </select>
                        <button id="closeChatMobile" class="hide-desktop" style="background: none; border: none; color: var(--text-secondary); cursor: pointer;"><i data-lucide="x"></i></button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Messages -->
                </div>

                <div class="chat-footer">
                    <form id="replyForm" class="form-group" style="flex-direction: column;">
                        <div style="display: flex; gap: 0.5rem; width: 100%;">
                            <input type="text" id="replyInput" placeholder="Escribe tu respuesta como Admin..." required>
                            <label for="adminFile" style="cursor: pointer; display: flex; align-items: center; padding: 0 0.75rem; border: 1px solid var(--border); border-radius: 8px;">
                                <i data-lucide="paperclip" size="18"></i>
                                <input type="file" id="adminFile" multiple style="display: none;">
                            </label>
                            <button type="submit" class="btn-send"><i data-lucide="send" size="18"></i></button>
                        </div>
                        <div id="adminFilePreview" style="font-size: 0.8rem; color: var(--accent); margin-top: 0.5rem; display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" onclick="this.style.display='none'">
        <button class="close-lightbox"><i data-lucide="x"></i></button>
        <img id="lightboxImg" src="" alt="Vista previa" onclick="event.stopPropagation()">
    </div>

    <script type="module" src="/js/admin-tickets.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
